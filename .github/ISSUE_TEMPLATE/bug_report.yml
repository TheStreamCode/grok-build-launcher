name: Bug report
description: Report a reproducible problem with the extension
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Grok Build Launcher. Remove secrets, tokens, and private repository content from every field.

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Click ...
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "0.1.8"
    validations:
      required: true

  - type: input
    id: editor-version
    attributes:
      label: Editor and version
      description: Include whether this is VS Code, Cursor, Windsurf, or another compatible editor.
      placeholder: "VS Code 1.103.0"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2, macOS 15, or Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Configured CLI command
      description: Remove paths or arguments that contain sensitive information.
      placeholder: "grok"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste only the minimal sanitized terminal or extension-host output needed to diagnose the issue.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: The configured command works or fails the same way in a regular integrated terminal.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report contains no secrets, tokens, or private repository content.
          required: true
