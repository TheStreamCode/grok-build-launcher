name: Feature request
description: Propose a focused improvement to the extension
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem before the preferred implementation. This independent project cannot accept official xAI or Grok brand assets without written permission from the rights holder.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need is not addressed today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and user experience.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs did you evaluate?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples or links. Do not attach official brand assets.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: This proposal keeps the project independent and unofficial.
          required: true
