name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            vscodeVersion: 1.103.0
          - os: ubuntu-latest
            vscodeVersion: stable
          - os: macos-latest
            vscodeVersion: 1.103.0

    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscodeVersion }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: npm run audit

      - name: Run validation suite
        if: runner.os != 'Linux'
        run: npm run check

      - name: Run validation suite on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check
